services:
  bubble_db_users:
    image: pgvector/pgvector:pg18
    container_name: bubble_db_users
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: bubble
    volumes:
      - postgres_data_users:/var/lib/postgresql
      - ./DB/users/init:/docker-entrypoint-initdb.d

  bubble_db_messages:
    image: pgvector/pgvector:pg18
    container_name: bubble_db_messages
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: bubble
    volumes:
      - postgres_data_messages:/var/lib/postgresql
      - ./DB/messages/init:/docker-entrypoint-initdb.d
      - ./pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf

  bubble_rdb:
    image: redis:8
    container_name: bubble_rdb
    restart: unless-stopped
    volumes:
      - redis_data:/data

  bubble_users:
    build: ./Users
    container_name: bubble_users
    restart: unless-stopped
    depends_on:
      - bubble_db_users
    environment:
      REDIS_HOST: bubble_rdb:6379
      DB_HOST: bubble_db_users
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 123
      DB_NAME: bubble

  bubble_messenger:
    build: ./Messenger
    container_name: bubble_messenger
    restart: unless-stopped
    depends_on:
      - bubble_db_messages
    environment:
      DB_HOST: bubble_db_messages
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 123
      DB_NAME: bubble

  bubble_files:
    build: ./Files
    container_name: bubble_files
    restart: unless-stopped
    ports:
      - "8081:8080"

  bubble_audio_dialog:
    build: ./AudioDialog
    container_name: bubble_audio_dialog
    restart: unless-stopped
    ports:
      - "8080:8080"

  bubble_main:
    build: ./Main
    container_name: bubble_main
    restart: unless-stopped
    ports:
      - "443:443"
      - "23099:23099"
      - "23098:23098"
      - "23097:23097"
    depends_on:
      - bubble_db_users
      - bubble_db_messages
      - bubble_rdb
      - bubble_users
      - bubble_messenger
      - bubble_files
      - bubble_audio_dialog
    environment:
      USERS_SERVICE_HOST_GRPC_PORT: bubble_users:8086
      MESSENGER_SERVICE_HOST_GRPC_PORT: bubble_messenger:8086
      FILES_SERVICE_HOST_GRPC_PORT: bubble_files:8086
      AUDIO_DIALOG_SERVICE_HOST_GRPC_PORT: bubble_audio_dialog:8086

volumes:
  postgres_data_users:
  postgres_data_messages:
  redis_data: